title: "[Show and tell] "
labels: ["show-and-tell"]
body:
  - type: markdown
    attributes:
      value: |
        Share a prompt, workflow, or `CLAUDE.md` that worked well — or one that
        failed instructively. **Failures are more valuable and far rarer.**

        A pattern that proves itself here is a strong candidate for becoming a
        playbook entry. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).

  - type: dropdown
    id: kind
    attributes:
      label: What are you sharing?
      options:
        - A prompt or workflow that worked
        - A prompt that failed, and why
        - A CLAUDE.md that improved results
        - A slash command or hook
        - An MCP server setup
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What it does
      description: The task it addresses and the outcome it produces.
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: The prompt, config, or workflow
      render: text
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: What happened
      description: >-
        What changed compared to not using it? Specifics beat impressions —
        "cut three correction rounds to one" is useful, "works great" is not.
    validations:
      required: true

  - type: textarea
    id: limits
    attributes:
      label: Where it does not work
      description: >-
        Every technique has a boundary. Naming yours is what separates a useful
        contribution from an advertisement.
    validations:
      required: false
